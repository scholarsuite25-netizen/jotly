[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-meeting-api"
version = "0.1.0"
description = "NEXUS Meeting Intelligence — FastAPI Backend & Worker Foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Explicit package configuration — required because the project directory
# also contains `migrations/` and `tests/`, which break setuptools
# flat-layout auto-discovery (the Vercel/uv build failure root cause).
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*", "wheel_test*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
